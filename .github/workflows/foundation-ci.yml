name: DUE Foundation CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject generated or secret files
        shell: bash
        run: |
          set -euo pipefail

          forbidden="$({
            git ls-files | grep -E '(^|/)(node_modules|dist|\.next|out|coverage|\.wrangler|\.sites-runtime|outputs|work|\.cache|\.turbo)(/|$)' || true
            git ls-files | grep -E '(^|/).*\.log$' || true
            git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true
            git ls-files | grep -E '\.(pem|key|crt)$' || true
          } | sort -u)"

          if [ -n "$forbidden" ]; then
            echo "Forbidden tracked files detected:"
            echo "$forbidden"
            exit 1
          fi

      - name: Enforce focused pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          count="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" | wc -l | tr -d ' ')"
          echo "Changed files: $count"
          if [ "$count" -gt 100 ]; then
            echo "Pull request exceeds the 100-file safety limit. Split the work."
            exit 1
          fi

  frontend-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and test
        run: npm test
